name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  build-api:
    name: Build API Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile.api
          # A manual run builds without publishing: off a tag there is no
          # version to publish under, and `latest` must not move.
          push: ${{ github.ref_type == 'tag' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/api:${{ github.ref_name }}
            ${{ env.IMAGE_PREFIX }}/api:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_PREFIX }}/api:latest

  build-web:
    name: Build Web Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile.web
          # See the API image above: manual runs build but do not publish.
          push: ${{ github.ref_type == 'tag' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/web:${{ github.ref_name }}
            ${{ env.IMAGE_PREFIX }}/web:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_PREFIX }}/web:latest

  create-release:
    name: Create GitHub Release
    # Only a tag names a release. A manual run would publish one called
    # after the branch and mark it latest.
    if: github.ref_type == 'tag'
    needs: [build-api, build-web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            --latest
