name: Release Helm Chart

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  release-chart:
    name: Package and push Helm chart
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5

      - uses: oras-project/setup-oras@v2

      - name: Extract version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            # A manual run lints and packages only, so keep the chart's own
            # version. A branch name is not valid SemVer and helm would reject it.
            awk '/^version:/ { print "version=" $2; exit }' charts/feloxi/Chart.yaml >> "$GITHUB_OUTPUT"
          fi

      - name: Stamp chart versions
        if: github.ref_type == 'tag'
        run: |
          sed -i "s/^version:.*/version: ${{ steps.version.outputs.version }}/" charts/feloxi/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${{ steps.version.outputs.version }}\"/" charts/feloxi/Chart.yaml

      - name: Lint
        run: helm lint charts/feloxi

      - name: Log in to GHCR
        if: github.ref_type == 'tag'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Package chart
        run: helm package charts/feloxi --destination /tmp/chart-pkg

      - name: Push chart to GHCR
        if: github.ref_type == 'tag'
        run: |
          helm push /tmp/chart-pkg/feloxi-${{ steps.version.outputs.version }}.tgz \
            oci://ghcr.io/${{ github.repository_owner }}/charts

      - name: Push ArtifactHub repository metadata
        if: github.ref_type == 'tag'
        run: |
          oras push \
            ghcr.io/${{ github.repository_owner }}/charts/feloxi:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.repository.metadata.layer.v1.yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository.metadata.layer.v1.yaml
