apiVersion: v2
name: feloxi
version: 0.2.0
appVersion: "2.0.4"
description: >-
  Open-source Celery task queue monitoring platform. Real-time task and worker
  visibility via a Rust API, Next.js dashboard, PostgreSQL, ClickHouse, and Redis.
type: application
home: https://github.com/thesaadmirza/feloxi
sources:
  - https://github.com/thesaadmirza/feloxi
maintainers:
  - name: Saad Mirza
    email: thesaadmirza@gmail.com
keywords:
  - celery
  - monitoring
  - task-queue
  - flower-alternative
  - rust
  - nextjs
  - redis
  - clickhouse
  - postgresql
  - real-time
  - workers
  - broker
icon: https://raw.githubusercontent.com/thesaadmirza/feloxi/main/.github/logo.svg
annotations:
  artifacthub.io/category: monitoring-logging
  artifacthub.io/license: Apache-2.0
  artifacthub.io/changes: |
    - kind: added
      description: "Alert notifications say which tenant they came from, on every channel (2.0.4)"
    - kind: fixed
      description: "Alert emails and Slack messages escape rule names, summaries and task names (2.0.4)"
    - kind: security
      description: "App images rebuild on lettre 0.11.22 (CVE-2026-46428) and nanoid 3.3.18 (CVE-2026-67213) (2.0.4)"
  artifacthub.io/containsSecurityUpdates: "true"
  artifacthub.io/prerelease: "false"
