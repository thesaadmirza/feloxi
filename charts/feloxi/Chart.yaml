apiVersion: v2
name: feloxi
version: 0.2.0
appVersion: "2.0.5"
description: >-
  Open-source Celery task queue monitoring platform. Real-time task and worker
  visibility via a Rust API, Next.js dashboard, PostgreSQL, ClickHouse, and Redis.
type: application
home: https://github.com/thesaadmirza/feloxi
sources:
  - https://github.com/thesaadmirza/feloxi
maintainers:
  - name: Saad Mirza
    email: thesaadmirza@gmail.com
keywords:
  - celery
  - monitoring
  - task-queue
  - flower-alternative
  - rust
  - nextjs
  - redis
  - clickhouse
  - postgresql
  - real-time
  - workers
  - broker
icon: https://raw.githubusercontent.com/thesaadmirza/feloxi/main/.github/logo.svg
annotations:
  artifacthub.io/category: monitoring-logging
  artifacthub.io/license: Apache-2.0
  artifacthub.io/changes: |
    - kind: security
      description: "Next.js 15.5.26 fixes an unauthenticated RCE in the image optimization endpoint (GHSA-2xp9-vwfh-vxw4) (2.0.5)"
    - kind: security
      description: "The API image runs on distroless cc-debian12, dropping unfixed critical CVEs in the Debian base (2.0.5)"
    - kind: security
      description: "The web image no longer ships npm, corepack or yarn, and picks up OpenSSL 3.5.8 (2.0.5)"
    - kind: changed
      description: "The API container runs as uid 65532 with no shell; use `api healthcheck` for container healthchecks (2.0.5)"
  artifacthub.io/containsSecurityUpdates: "true"
  artifacthub.io/prerelease: "false"
