apiVersion: v2
name: feloxi
version: 0.2.0
appVersion: "2.1.0"
description: >-
  Open-source Celery task queue monitoring platform. Real-time task and worker
  visibility via a Rust API, Next.js dashboard, PostgreSQL, ClickHouse, and Redis.
type: application
home: https://github.com/thesaadmirza/feloxi
sources:
  - https://github.com/thesaadmirza/feloxi
maintainers:
  - name: Saad Mirza
    email: thesaadmirza@gmail.com
keywords:
  - celery
  - monitoring
  - task-queue
  - flower-alternative
  - rust
  - nextjs
  - redis
  - clickhouse
  - postgresql
  - real-time
  - workers
  - broker
icon: https://raw.githubusercontent.com/thesaadmirza/feloxi/main/.github/logo.svg
annotations:
  artifacthub.io/category: monitoring-logging
  artifacthub.io/license: Apache-2.0
  artifacthub.io/changes: |
    - kind: changed
      description: "New dashboard design with Night and Day themes, a command palette and mobile layouts (2.1.0)"
    - kind: fixed
      description: "Task retry publishes messages workers can run; API keys authenticate; magic-link sign-in works for multi-org users (2.1.0)"
    - kind: security
      description: "Broker URLs are encrypted at rest and credentials are masked in broker errors (2.1.0)"
  artifacthub.io/containsSecurityUpdates: "true"
  artifacthub.io/prerelease: "false"
