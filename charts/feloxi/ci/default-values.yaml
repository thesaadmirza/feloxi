# Throwaway values so CI can render every template. `helm lint` alone only
# warns when the required secrets are missing and never renders the chart, so
# these supply the four required fields and nothing else.
#
# The templates only check these are non-empty, so keep them obviously fake.
# A realistic base64 key here reads as a real leak to secret scanners.
auth:
  jwtSecret: "ci-jwt-secret-that-is-at-least-32-chars"
  encryptionKey: "ci-placeholder-run-openssl-rand-base64-32-for-a-real-one"
postgresql:
  auth:
    password: "ci-postgres-password"
clickhouse:
  auth:
    password: "ci-clickhouse-password"
